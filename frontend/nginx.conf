server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;

    # Behind a reverse proxy on the Docker network, use the client address it reports, or every
    # visitor shares one rate-limit bucket. Only private Docker ranges are trusted to say so.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Server-sent events: flush every step straight through, and keep long runs open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
